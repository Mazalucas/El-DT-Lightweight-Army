# Catálogo de módulos — Lucas Prime (segundo cerebro)
# IDs alineados con vitals/workspace.yaml cuando exista entrada multi-proyecto.
# Humano: vitals/catalog/INDEX.md · Portal: BRAIN.md

version: 1
updated: "2026-06-03"
default_module: lucas-prime

modules:
  - id: lucas-prime
    kind: hub
    label: "Lucas Prime — segundo cerebro"
    status: active
    location:
      type: internal
      path: .
    tags: [dt, brain, orchestration]
    aliases: [brain, hub, prime]
    entrypoints:
      readme: README.md
      brain: BRAIN.md
      agents: AGENTS.md

  - id: facturas-autonomo-es
    kind: tool
    label: "Facturas autónomo (España)"
    status: active
    location:
      type: internal
      path: modules/facturas-autonomo-es
    tags: [facturas, autonomo, españa, fiscal, herramienta]
    aliases: [facturas, autonomo, invoices-es]
    entrypoints:
      readme: README.md
      dev: "./scripts/dev-facturas-autonomo.sh"
      command: "/nueva-factura"
      assets: assets/
      requirements: docs/requisitos-factura-es.md
    dependencies: []

  - id: cerebro-app
    kind: hub
    label: "Cerebro App — webapp unificada"
    status: active
    location:
      type: internal
      path: modules/cerebro-app
    tags: [cerebro, webapp, firebase, hub, produccion]
    aliases: [cerebro-app, app]
    entrypoints:
      readme: README.md
      dev: "./scripts/dev-cerebro-app.sh"
      command: "/start"
      deploy: "./scripts/deploy-cerebro-app.sh"
    dependencies: []

  - id: tools-hub
    kind: hub
    label: "Tools Hub — índice interactivo (legacy local)"
    status: deprecated
    location:
      type: internal
      path: modules/tools-hub
    tags: [hub, tools, indice, launcher, busqueda]
    aliases: [start, launcher, tools, indice]
    entrypoints:
      readme: README.md
      dev: "./scripts/dev-tools-hub.sh"
      command: "/tools-hub"
    dependencies: []

  - id: recordatorios
    kind: tool
    label: "Recordatorios"
    status: active
    location:
      type: internal
      path: modules/recordatorios
    tags: [recordatorios, productividad, tareas, herramienta]
    aliases: [reminders, todos, recordatorio]
    entrypoints:
      readme: README.md
      dev: "./scripts/dev-recordatorios.sh"
      command: "/recordatorios"
      capture_command: "/recordatorio"
      bridge: bridge/inbox.schema.json
    dependencies: []

  - id: meet-notes-sync
    kind: tool
    label: "Sync notas Meet → Markdown"
    status: active
    location:
      type: internal
      path: modules/meet-notes-sync
    tags: [meet, gemini, sync, google-docs]
    aliases: [meet-sync, sincronizar-notas]
    entrypoints:
      readme: README.md
      dev: "./scripts/sync-meet-notes.sh"
      command: "/sincronizar-notas-meet"
    dependencies: []

  - id: cerebro-profesional
    kind: tool
    label: "Cerebro profesional"
    status: active
    location:
      type: internal
      path: modules/cerebro-profesional
    tags: [reuniones, contactos, equipos, meet, cerebro]
    aliases: [cerebro, reuniones, meet-brain]
    entrypoints:
      readme: README.md
      dev: "./scripts/dev-cerebro-profesional.sh"
      command: "/cerebro-profesional"
      bridge: bridge/analysis-inbox.schema.json
    dependencies:
      - meet-notes-sync
