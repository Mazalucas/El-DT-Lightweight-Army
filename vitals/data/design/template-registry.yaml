# Atelier — registro de templates (design systems + estilos visuales)
# Contrato IA: Markdown-only — ver templates/PROTOCOL.md
version: 3
updated: "2026-06-23"

base_path: .cursor/skills/design/templates
protocol: .cursor/skills/design/templates/PROTOCOL.md
placeholders_md: .cursor/skills/design/templates/shared/placeholders.md
placeholders_yaml: vitals/data/design/template-placeholders.yaml

# Plantillas canónicas por DESIGN SYSTEM (prioridad)
