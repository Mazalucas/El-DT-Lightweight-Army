# Overlays visuales
styles:
  swiss-style:
    id: swiss-style
    label: Swiss / International Typographic
    surfaces: [landing, product-shell]
    files:
      tokens: styles/swiss-style/tokens.css
      landing: styles/swiss-style/landing.md
      product_shell: styles/swiss-style/product-shell.md
    pairing_systems: [carbon-design, material-design, none]

  bauhaus-style:
    id: bauhaus-style
    label: Bauhaus (adapted)
    surfaces: [landing, product-shell]
    files:
      tokens: styles/bauhaus-style/tokens.css
      landing: styles/bauhaus-style/landing.md
      product_shell: styles/bauhaus-style/product-shell.md

  digital-minimalism:
    id: digital-minimalism
    label: Digital Minimalism
    surfaces: [landing, product-shell, auth]
    files:
      tokens: styles/digital-minimalism/tokens.css
      landing: styles/digital-minimalism/landing.md
      product_shell: styles/digital-minimalism/product-shell.md
      auth: styles/digital-minimalism/auth.md
    slop_risk: high

  neumorphism:
    id: neumorphism
    label: Neumorphism (partial)
    surfaces: [controls, product-shell]
    max_ui_percent: 20
    files:
      tokens: styles/neumorphism/tokens.css
      controls: styles/neumorphism/controls.md
      product_shell: styles/neumorphism/product-shell.md

  glassmorphism:
    id: glassmorphism
    label: Glassmorphism (controlled)
    surfaces: [landing, product-shell, nav-overlay]
    max_ui_percent: 30
    files:
      tokens: styles/glassmorphism/tokens.css
      landing: styles/glassmorphism/landing.md
      product_shell: styles/glassmorphism/product-shell.md
      nav_overlay: styles/glassmorphism/nav-overlay.md

frameworks:
  slide-deck-html:
    id: slide-deck-html
    label: Slide deck HTML (fullscreen)
    surfaces: [slide-deck]
    requires_brand_manual: true
    files:
      tokens: frameworks/slide-deck-html/tokens.css
      presentation: frameworks/slide-deck-html/presentation.md
      surface: shared/surface-slide-deck.md
      preview: preview/pages/slide-deck-framework-presentation.html
    skill: frameworks/slide-deck-html/SKILL.md

usage:
  agent_read_order:
    - templates/PROTOCOL.md
    - templates/shared/placeholders.md
    - one system folder OR one style folder (markdown only)
  primary_templates: systems
  never_load_all_systems: true
  no_script_generation: true
