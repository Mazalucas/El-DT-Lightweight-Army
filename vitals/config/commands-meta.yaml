# Fuente canónica de commands DT — editar aquí primero, luego reflejar en .cursor/commands y .agent/workflows
version: 1
updated: "2026-06-26"
locale: es

groups:
  routine:
    title: "Rutina del día a día"
    description: "Sincronizar con el equipo, identidad local y subir trabajo."
  work:
    title: "Trabajo con el framework"
    description: "Orquestación, análisis y entrega técnica del repo."
  framework:
    title: "Framework DT"
    description: "Desarrollo y evolución del orquestador (no día a día de producto)."
  design:
    title: "Diseño y Atelier"
    description: "Design intelligence — contexto, selección de sistema, anti-slop, specs UI."
  video:
    title: "Video programático"
    description: "Remotion — composiciones React, motion graphics, render."
  modules:
    title: "Módulos del segundo cerebro"
    description: "Atajos para herramientas y proyectos registrados en vitals/catalog/."

commands:
  actualizar:
    group: routine
    tagline: "Sincronizar tu proyecto y comprobar novedades del framework DT."
    when: "Al abrir el editor; antes de /guardar si estás behind."
    example: "/actualizar"
    skill: git-actualizar
  yo:
    group: routine
    tagline: "Decir quién está trabajando en esta máquina."
    when: "Después de cada /actualizar; primera vez en el repo."
    example: '/yo → "Soy Ana García, rol desarrollo"'
    skill: dt-session
  guardar:
    group: routine
    tagline: "Subir mi trabajo a GitHub."
    when: "Al cerrar bloque de trabajo o antes de irte."
    example: "/guardar"
    skill: git-guardar
  exit:
    group: routine
    tagline: "Cerrar dev servers locales de módulos (Vite)."
    when: "Al terminar la jornada o cuando quedaron apps abiertas en segundo plano."
    example: "/exit"
    skill: exit
  bienvenida:
    group: routine
    tagline: "Primera vez en este repo — verificar que El DT está listo."
    when: "Justo después de clonar o abrir el DT por primera vez en esta máquina."
    example: "/bienvenida"
    skill: dt-setup
  orquestar:
    group: work
    tagline: "Pipeline completo del DT en 8 pasos."
    when: "Tarea con alcance amplio o varias capas del repo."
    example: "/orquestar"
    skill: null
    command_path: .cursor/commands/orquestar.md
  fast-lane:
    group: work
    tagline: "Ejecutar alcance cerrado con menos preguntas rutinarias."
    when: "Alcance ya definido; no relaja seguridad."
    example: "/fast-lane"
    skill: null
    command_path: .cursor/commands/fast-lane.md
  cuestionar:
    group: work
    tagline: "Solo análisis y alternativas — sin ejecutar."
    when: "Querés validar idea antes de tocar código."
    example: "/cuestionar"
    skill: null
    command_path: .cursor/commands/cuestionar.md
  contexto:
    group: work
    tagline: "Mapa del repo y vista de sistema."
    when: "Entrás a un repo desconocido o después de un pull grande."
    example: "/contexto"
    skill: null
    command_path: .cursor/commands/contexto.md
  prepr:
    group: work
    tagline: "Preparar cambios como PR."
    when: "Antes de abrir pull request."
    example: "/prepr"
    skill: null
    command_path: .cursor/commands/prepr.md
  setup-cursor:
    group: framework
    tagline: "Dejar solo configuración Cursor en este clon."
    when: "Setup inicial o cambio de IDE."
    example: "/setup-cursor"
    skill: null
    command_path: .cursor/commands/setup-cursor.md
  setup-antigravity:
    group: framework
    tagline: "Dejar solo configuración Antigravity en este clon."
    when: "Setup inicial o cambio de IDE."
    example: "/setup-antigravity"
    skill: null
    workflow_path: .agent/workflows/setup-antigravity.md
  setup:
    group: framework
    tagline: "Verificar o reparar la estructura multi-IDE del DT."
    when: "Tras un pull grande, drift entre IDEs, o si algo del DT no carga."
    example: "/setup"
    skill: dt-setup
  bootstrap:
    group: framework
    tagline: "Usar El DT como base: promover al raíz y soltar el remoto del template."
    when: "Arrancar un proyecto nuevo a partir del template."
    example: "/bootstrap"
    skill: dt-bootstrap
  actualizar-dt:
    group: framework
    tagline: "Incorporar una nueva versión del framework DT desde upstream."
    when: "Cuando /actualizar avisó una versión más nueva; working tree limpio."
    example: "/actualizar-dt"
    skill: dt-actualizar
  github-save-small:
    group: framework
    tagline: "Versionado tipo release — bump, commit, tag, push."
    when: "Cierre de iteración del template o app consumidora."
    example: "/github-save-small"
    skill: github-save-release
    command_path: .cursor/commands/github-save-small.md
  atelier:
    group: design
    tagline: "Design intelligence Impeccable + DT — craft, audit, anti-slop, 23+ commands."
    when: "Landing, dashboard, mockup, craft UI, critique, polish, design system."
    example: "/atelier init  ·  /atelier craft hero  ·  /atelier actualizar"
    skill: atelier
  remotion:
    group: video
    tagline: "Video programático con Remotion — composiciones, motion, render."
    when: "Video en código, motion graphics, promo, explainers, render MP4."
    example: "/remotion promo 30s 9:16  ·  /remotion init mi-video"
    skill: remotion-producer
  nueva-factura:
    group: modules
    tagline: "Abrir la app local de facturas autónomo (España)."
    when: "Querés emitir o borrador una factura sin recordar paths ni npm."
    example: "/nueva-factura"
    skill: nueva-factura
  start:
    group: modules
    tagline: "Abrir Tools Hub — índice interactivo de herramientas con búsqueda."
    when: "Querés ver o encontrar rápido tus tools y commands del segundo cerebro."
    example: "/start"
    skill: start
  recordatorio:
    group: modules
    tagline: "Crear un recordatorio desde el chat (cola local → app web)."
    when: "Capturás una tarea sin abrir el navegador; usá @categoria #tag y fechas como mañana."
    example: "/recordatorio comprar leche mañana @personal #casa"
    skill: recordatorio
  recordatorios:
    group: modules
    tagline: "Recordatorios unificados en Cerebro profesional (vista Recordatorios)."
    when: "Querés ver tareas con fecha — redirige a /cerebro-profesional."
    example: "/recordatorios"
    skill: recordatorios
    deprecated: true
    redirect: cerebro-profesional
  cerebro-profesional:
    group: modules
    tagline: "Agenda de reuniones, contactos, equipos y búsqueda profesional."
    when: "Querés explorar notas Meet, timelines por persona o filtrar por proyecto."
    example: "/cerebro-profesional"
    skill: cerebro-profesional
  sincronizar-notas-meet:
    group: modules
    tagline: "Exportar notas Gemini (.gdoc) a Markdown local en el cerebro."
    when: "Hay reuniones nuevas en Drive o falta contenido en el espejo .md."
    example: "/sincronizar-notas-meet"
    skill: sincronizar-notas-meet
  cerebro-work:
    group: modules
    tagline: "Sync cerebro profesional — atajo CerebroWork (script en raíz)."
    when: "Querés correr el sync Meet→Markdown sin recordar paths; ritual rápido post-OAuth."
    example: "/CerebroWork"
    skill: cerebro-work
  indexar-reuniones:
    group: modules
    tagline: "Actualizar manifest de archivos Meet sin descargar contenido."
    when: "Solo querés saber qué hay nuevo en la carpeta de grabaciones."
    example: "/indexar-reuniones"
    skill: indexar-reuniones
  procesar-reuniones:
    group: modules
    tagline: "Analizar notas .md locales y enriquecer contactos/proyectos (Cursor)."
    when: "Tras sincronizar; refinás personas, temas y action items."
    example: "/procesar-reuniones"
    skill: procesar-reuniones
  deploy:
    group: modules
    tagline: "Desplegar Cerebro App a Firebase (build + hosting/functions)."
    when: "Querés publicar cambios de la webapp unificada en producción."
    example: "/deploy"
    skill: deploy
