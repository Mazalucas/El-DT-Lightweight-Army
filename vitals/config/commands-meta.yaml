# Fuente canónica de commands DT — editar aquí primero, luego reflejar en .cursor/commands y .agents/workflows
version: 1
updated: "2026-08-04"
locale: es

groups:
  routine:
    title: "Rutina del día a día"
    description: "Sincronizar con el equipo, identidad local y subir trabajo."
  work:
    title: "Trabajo con el framework"
    description: "Orquestación, análisis y entrega técnica del repo."
  framework:
    title: "Framework DT"
    description: "Desarrollo y evolución del orquestador (no día a día de producto)."
  design:
    title: "Diseño y Atelier"
    description: "Design intelligence — contexto, selección de sistema, anti-slop, specs UI."
  video:
    title: "Video programático"
    description: "Remotion — composiciones React, motion graphics, render."

commands:
  actualizar:
    group: routine
    tagline: "Sincronizar tu proyecto y comprobar novedades del framework DT."
    when: "Al abrir el editor; antes de /guardar si estás behind."
    example: "/actualizar"
    skill: git-actualizar
  yo:
    group: routine
    tagline: "Decir quién está trabajando en esta máquina."
    when: "Después de cada /actualizar; primera vez en el repo."
    example: '/yo → "Soy Ana García, rol desarrollo"'
    skill: dt-session
  guardar:
    group: routine
    tagline: "Subir a GitHub — bump patch, sync README/front/back, commit vX.Y.Z, tag."
    when: "Al cerrar bloque con cambios. Minor: /guardar release minor."
    example: "/guardar"
    skill: git-guardar
  deploy:
    group: work
    tagline: "Desplegar la app — primera vez autocompleta scripts y config del repo."
    when: "Querés publicar a staging o producción; tras bootstrap genera vitals/config/deploy.yaml."
    example: "/deploy production"
    skill: deploy
  drive:
    group: routine
    tagline: "Conectar Google Drive y elegir carpetas como contexto del cerebro."
    when: "Primera vez que querés consultar documentos en Drive con el DT; o para cambiar qué carpetas compartís."
    example: "/drive"
    skill: dt-drive
  bienvenida:
    group: routine
    tagline: "Primera vez post-clone — checklist + mensaje de bienvenida con commands recomendados (incluye /setup si falta estructura)."
    when: "Justo después de clonar o abrir el DT por primera vez; la IA también puede mostrarlo sin invocación si no hay sesión local."
    example: "/bienvenida"
    skill: dt-setup
  orquestar:
    group: work
    tagline: "Pipeline completo del DT en 8 pasos."
    when: "Tarea con alcance amplio o varias capas del repo."
    example: "/orquestar"
    skill: null
    command_path: .cursor/commands/orquestar.md
  fast-lane:
    group: work
    tagline: "Ejecutar alcance cerrado con menos preguntas rutinarias."
    when: "Alcance ya definido; no relaja seguridad."
    example: "/fast-lane"
    skill: null
    command_path: .cursor/commands/fast-lane.md
  cuestionar:
    group: work
    tagline: "Solo análisis y alternativas — sin ejecutar."
    when: "Querés validar idea antes de tocar código."
    example: "/cuestionar"
    skill: null
    command_path: .cursor/commands/cuestionar.md
  contexto:
    group: work
    tagline: "Mapa del repo y vista de sistema."
    when: "Entrás a un repo desconocido o después de un pull grande."
    example: "/contexto"
    skill: null
    command_path: .cursor/commands/contexto.md
  prepr:
    group: work
    tagline: "Preparar cambios como PR."
    when: "Antes de abrir pull request."
    example: "/prepr"
    skill: null
    command_path: .cursor/commands/prepr.md
  verificar:
    group: work
    tagline: "Verificar números de planillas y reportes con script, sin cálculo mental de la IA."
    when: "Compartís una planilla/reporte o pedís totales, sumas o reconciliación de cifras."
    example: "/verificar ventas-junio.csv → totales y checks"
    skill: data-auditor
    agent: data-auditor
  hack:
    group: work
    tagline: "Auditoría de seguridad del proyecto — mentalidad de atacante, entrega defensiva (SEV + prioridad)."
    when: "Querés cazar vulnerabilidades, auth/permisos, API, secrets, superficie de agentes/IA o riesgos de arquitectura en el propio repo."
    example: "/hack  ·  /hack auth  ·  /hack api  ·  /hack agents  ·  /hack diff"
    skill: hack-audit
    agent: hack-audit
  ordenar:
    group: work
    tagline: "Capturar archivos, carpetas y dumps del chat — documentar en la capa correcta y dejar manifest recuperable."
    when: "Volcás mucha data, briefs, notas o paths y querés que el DT clasifique, documente e indexe para reutilizar."
    example: "/ordenar  ·  /ordenar quick  ·  /ordenar inbox  ·  /ordenar docs onboarding"
    skill: dt-ordenar

  setup:
    group: framework
    tagline: "Verificar o reparar la estructura multi-IDE del DT."
    when: "Tras un pull grande, drift entre IDEs, o si algo del DT no carga."
    example: "/setup"
    skill: dt-setup
  bootstrap:
    group: framework
    tagline: "Usar El DT como base: promover al raíz y soltar el remoto del template."
    when: "Arrancar un proyecto nuevo a partir del template."
    example: "/bootstrap"
    skill: dt-bootstrap
  actualizar-dt:
    group: framework
    tagline: "Incorporar una nueva versión del framework DT desde upstream."
    when: "Cuando /actualizar avisó una versión más nueva; working tree limpio."
    example: "/actualizar-dt"
    skill: dt-actualizar
  github-save-small:
    group: framework
    tagline: "Versionado tipo release — bump, commit, tag, push."
    when: "Cierre de iteración del template o app consumidora."
    example: "/github-save-small"
    skill: github-save-release
    command_path: .cursor/commands/github-save-small.md
  atelier:
    group: design
    tagline: "Design intelligence Impeccable + DT — craft, audit, anti-slop, 23+ commands."
    when: "Landing, dashboard, mockup, craft UI, critique, polish, design system."
    example: "/atelier init  ·  /atelier craft hero  ·  /atelier actualizar"
    skill: atelier
  remotion:
    group: video
    tagline: "Video programático con Remotion — composiciones, motion, render."
    when: "Video en código, motion graphics, promo, explainers, render MP4."
    example: "/remotion promo 30s 9:16  ·  /remotion init mi-video"
    skill: remotion-producer
    agent: remotion-producer
