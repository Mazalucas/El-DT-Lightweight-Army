# Preferencias de panel para /analisis-propuesta — no es allowlist cerrada.
# En runtime se elige el primer slug de cada familia que exista en available_subagent_models.
version: 1
updated: "2026-09-23"

panel_size: 3

# Familias distintas → modelos distintos en el panel (diversidad de vendor).
families:
  anthropic:
    - claude-opus-5-5-medium
  openai:
    - gpt-5.6-sol-medium
  xai:
    - grok-4.7-xhigh-fast
  cursor:
    - composer-2.5
    - composer-2.5-fast
    - cursor-grok-4.6-xhigh

# Slugs que nunca son panelistas (mismo modelo que el padre o placeholder).
never_panel:
  - inherit
